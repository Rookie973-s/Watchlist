<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RTSTUDIOS Watchlist</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0MSC72FNTK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date()); gtag('config', 'G-0MSC72FNTK');
</script>
<style>
:root{
  --bg:#08080a; --panel:#141417; --raised:#1d1d22; --line:rgba(255,255,255,.08);
  --red:#e50914; --red-hi:#ff2a36; --text:#f2f2f2; --dim:#9b9ba6; --mute:#62626d; --ok:#2dd4a0;
  --font:'Outfit',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;padding:14px 4vw;
  background:linear-gradient(#08080a 55%,rgba(8,8,10,.85));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--red)}
.tabs{display:flex;gap:4px;flex:1}
.tab{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--dim)}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;background:var(--raised)}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;text-transform:uppercase}
.link{color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px}
.link:hover{color:#fff;background:var(--raised)}

main{max-width:1280px;margin:0 auto;padding:28px 4vw 80px}

/* sign in */
.gate{max-width:380px;margin:9vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px}
.gate h1{font-size:26px;font-weight:700}
.gate p{color:var(--dim);font-size:14px;margin:6px 0 22px;line-height:1.5}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
input[type=text],input[type=password],select{width:100%;padding:12px 14px;background:var(--raised);border:1px solid var(--line);border-radius:8px;outline:none}
input:focus,select:focus{border-color:var(--red)}
::placeholder{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;background:var(--red);color:#fff;transition:background .15s}
.btn:hover{background:var(--red-hi)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.wide{width:100%;margin-top:6px}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:10px}

/* hero carousel */
.hero{position:relative;height:clamp(300px,40vw,430px);border-radius:14px;overflow:hidden;margin-bottom:30px;background:var(--panel)}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:opacity .45s}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.96) 0%,rgba(8,8,10,.65) 42%,rgba(8,8,10,0) 80%),linear-gradient(0deg,rgba(8,8,10,.85),rgba(8,8,10,0) 45%)}
.hbody{position:absolute;left:clamp(20px,5vw,56px);right:20px;bottom:clamp(40px,6vw,64px);max-width:540px}
.hmeta{font-size:12px;color:var(--dim);margin-bottom:8px}
.hrate{font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hrate b{color:#f5c518}
.hero h2{font-size:clamp(26px,4.2vw,46px);font-weight:700;line-height:1.1;margin-bottom:12px}
.hero p{font-size:13px;line-height:1.55;color:#d0d0d6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn.dark{background:#000;border:1px solid var(--line)}
.btn.dark:hover{background:#1a1a1f}
.hdots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.hdots button{width:34px;height:12px;position:relative}
.hdots button::after{content:"";position:absolute;left:0;right:0;top:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.3);transition:.2s}
.hdots button.on::after{background:#fff}

/* add bar */
.addbar{position:relative;max-width:640px;margin:0 auto 30px}
.addbar input{padding:15px 18px 15px 46px;font-size:15px;border-radius:999px;background:var(--panel)}
.addbar svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
#ac{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;max-height:360px;overflow-y:auto;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.ac-row{display:flex;gap:14px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.ac-row:last-child{border:0}
.ac-row:hover,.ac-row:focus-visible{background:#26262d}
.ac-row img{width:40px;height:60px;object-fit:cover;border-radius:5px}
.ac-t{font-weight:500;font-size:14px}
.ac-s{font-size:12px;color:var(--dim);margin-top:3px}
.ac-in{margin-left:auto;font-size:11px;color:var(--ok)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:16px}
.group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);color:var(--dim);transition:.15s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.sortbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-left:auto}
.sortbox select{width:auto;padding:8px 12px}
.findbox{flex:1 1 200px;max-width:280px}
.findbox input{padding:9px 14px;border-radius:999px;font-size:13px}
.stats{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim);margin-bottom:30px}
.stats b{color:#fff}
.bar{flex:1;height:3px;border-radius:9px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .5s}

/* grid */
.sec{margin-bottom:42px}
.sec h2{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:baseline;gap:10px}
.sec h2 small{font-size:13px;font-weight:400;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 18px}
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:0 10px 24px rgba(0,0,0,.55);transition:transform .2s}
.card:hover .poster{transform:translateY(-4px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{height:100%;display:grid;place-items:center;padding:12px;text-align:center;color:var(--mute);font-size:13px}
.tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.seen{position:absolute;inset:auto 0 0 0;padding:6px;text-align:center;font-size:11px;font-weight:600;background:rgba(45,212,160,.92);color:#04271c}
.card.done .poster img{filter:grayscale(.7) brightness(.6)}
.name{margin-top:10px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:10px}
.dl{flex:1;padding:8px 6px;border-radius:7px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.dl:hover{background:var(--red-hi)}
.ib{width:36px;border-radius:7px;background:var(--raised);color:var(--dim);display:grid;place-items:center}
.ib:hover{color:#fff;background:#2b2b33}
.ib.on{background:var(--ok);color:#04271c}
.ib.del:hover{background:rgba(255,70,70,.18);color:#ff6b6b}

.empty{text-align:center;padding:70px 20px;color:var(--dim)}
.empty h3{color:var(--text);font-size:18px;margin-bottom:8px}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:99;
  display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:10px;background:#26262d;border:1px solid var(--line);font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:.25s;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--red-hi);font-weight:600}

@media(max-width:620px){
  .top{gap:10px;padding:12px 4vw;flex-wrap:wrap}
  .tabs{order:3;flex-basis:100%}
  .user .uname{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 12px}
  .sortbox{margin-left:0}
  .findbox{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">RTSTUDIOS</div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab on" data-type="all">All</button>
    <button class="tab" data-type="movie">Movies</button>
    <button class="tab" data-type="tv">Series</button>
  </nav>
  <div class="user" id="user" hidden>
    <span class="uname" id="uname"></span><div class="avatar" id="avatar"></div>
    <button class="link" id="logout">Sign out</button>
  </div>
</header>

<main>
  <!-- SIGN IN -->
  <section class="gate" id="gate">
    <h1>Your watchlist</h1>
    <p>Sign in to keep track of movies and series. New username? We create the account for you.</p>
    <form id="loginForm">
      <label class="field"><span>Username</span><input type="text" id="u" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" id="p" autocomplete="current-password" required></label>
      <button class="btn wide" id="loginBtn" type="submit">Continue</button>
      <div class="err" id="loginErr" role="alert"></div>
    </form>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <section class="hero" id="hero" hidden aria-label="Recently added">
      <img class="hbg" id="hBg" alt="">
      <div class="hshade"></div>
      <div class="hbody">
        <div class="hmeta" id="hMeta"></div>
        <div class="hrate" id="hRate"></div>
        <h2 id="hTitle"></h2>
        <p id="hDesc"></p>
        <div class="hbtns">
          <button class="btn" id="hDl"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>Download</button>
          <button class="btn dark" id="hSeen"></button>
        </div>
      </div>
      <div class="hdots" id="hDots"></div>
    </section>

    <div class="addbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="addInput" placeholder="Search a movie or series to add" autocomplete="off">
      <div id="ac" hidden></div>
    </div>

    <div class="toolbar">
      <div class="group" id="statusChips">
        <button class="chip on" data-status="all">All</button>
        <button class="chip" data-status="unwatched">Unwatched</button>
        <button class="chip" data-status="watched">Watched</button>
      </div>
      <div class="findbox"><input type="text" id="findInput" placeholder="Filter your list"></div>
      <label class="sortbox">Sort by
        <select id="sortSel">
          <option value="latest">Latest added</option>
          <option value="oldest">Oldest added</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
        </select>
      </label>
    </div>

    <div class="stats"><span><b id="sW">0</b> watched</span><div class="bar"><i id="sBar" style="width:0"></i></div><span><b id="sT">0</b> total</span></div>

    <div id="rows"></div>
  </div>
</main>

<div id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
const TMDB_KEY = "276ce1441c92d4989b5a0080e47e0633";
const IMG  = "https://image.tmdb.org/t/p/w342";
const API  = "https://rtwatch-backend.onrender.com";
const TG   = "https://t.me/rtmoviestalk";

const S = { token:null, user:null, items:[], type:"all", status:"all", sort:"latest", q:"" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isTv = it => it.mediaType === "tv";
const keyOf = it => it.tmdbId ? `${it.mediaType}:${it.tmdbId}` : `n:${it.name.trim().toLowerCase()}`;
const posterUrl = p => p ? p.replace("/w92/", "/w342/") : "";
const ts = it => it.addedAt ? Date.parse(it.addedAt) || 0 : 0;

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actLabel, actFn) {
  $("toastMsg").textContent = msg;
  const b = $("toastAct");
  b.hidden = !actLabel;
  if (actLabel) { b.textContent = actLabel; b.onclick = () => { actFn(); $("toast").classList.remove("show"); }; }
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), actLabel ? 5000 : 2600);
}

/* ---------- data: one source of truth (S.items), the DOM is only a view ---------- */
function dedupe(list) {
  const map = new Map();
  list.forEach(it => {
    const k = keyOf(it), prev = map.get(k);
    if (prev) { prev.watched = prev.watched || it.watched; if (!prev.addedAt && it.addedAt) prev.addedAt = it.addedAt; }
    else map.set(k, { ...it, _i: map.size });
  });
  return [...map.values()];
}

/* saves are serialised so two requests can never overwrite each other out of order */
let saving = false, dirty = false;
function save() { dirty = true; if (!saving) flush(); }
async function flush() {
  saving = true;
  while (dirty) {
    dirty = false;
    if (!S.token) break;
    const watchlist = S.items.map(({ name, watched, poster, tmdbId, mediaType, year, addedAt }) =>
      ({ name, watched, poster, tmdbId: tmdbId || 0, mediaType: mediaType || "", year: year || "", addedAt: addedAt || null }));
    try {
      const r = await fetch(`${API}/api/watchlist`, { method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:`Bearer ${S.token}` }, body: JSON.stringify({ watchlist }) });
      if (!r.ok) toast("Couldn't sync your list. Check your connection.");
    } catch (e) { console.error(e); toast("Couldn't sync your list. Check your connection."); }
  }
  saving = false;
}

let loadSeq = 0;
async function loadList() {
  const seq = ++loadSeq;
  const r = await fetch(`${API}/api/watchlist`, { headers:{ Authorization:`Bearer ${S.token}` } });
  if (r.status === 401) return signOut(true);
  const d = await r.json();
  if (seq !== loadSeq) return;
  S.items = dedupe(d.watchlist || []);
  render();
  migrateOld();
}

/* older entries only stored a name + poster: look them up once so they get a type, year and HD poster */
async function migrateOld() {
  const tok = S.token, queue = S.items.filter(i => !i.tmdbId);
  if (!queue.length) return;
  let changed = false;
  await Promise.all([0,1,2,3].map(async () => {
    while (queue.length) {
      const it = queue.shift();
      try {
        const r = await (await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&include_adult=false&query=${encodeURIComponent(it.name)}`)).json();
        const h = (r.results || []).find(x => (x.media_type === "movie" || x.media_type === "tv") && x.poster_path);
        if (h) { Object.assign(it, { tmdbId:h.id, mediaType:h.media_type, year:(h.release_date||h.first_air_date||"").slice(0,4), poster:IMG+h.poster_path }); changed = true; }
      } catch (e) {}
    }
  }));
  if (changed && S.token === tok) { S.items = dedupe(S.items); render(); save(); }
}

/* ---------- Telegram download request ---------- */
async function requestDownload(it) {
  try { await navigator.clipboard.writeText(it.name); toast(`"${it.name}" copied. Paste it in the group chat.`); }
  catch (e) { toast("Opening Telegram. Type the title in the group."); }
  window.open(TG, "_blank", "noopener");
}

/* ---------- render ---------- */
function view() {
  const q = S.q.toLowerCase();
  const list = S.items.filter(it =>
    (S.type === "all" || (S.type === "tv") === isTv(it)) &&
    (S.status === "all" || (S.status === "watched") === !!it.watched) &&
    (!q || it.name.toLowerCase().includes(q)));
  const by = {
    latest: (a,b) => ts(b) - ts(a) || b._i - a._i,
    oldest: (a,b) => ts(a) - ts(b) || a._i - b._i,
    az: (a,b) => a.name.localeCompare(b.name),
    za: (a,b) => b.name.localeCompare(a.name)
  }[S.sort];
  return list.sort(by);
}

function cardHTML(it) {
  const k = esc(keyOf(it));
  const added = it.addedAt ? new Date(it.addedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
  const p = posterUrl(it.poster);
  return `<article class="card${it.watched ? " done" : ""}" data-k="${k}">
    <div class="poster">${p ? `<img src="${esc(p)}" alt="" loading="lazy">` : `<div class="noimg">${esc(it.name)}</div>`}
      <span class="tag">${isTv(it) ? "SERIES" : "MOVIE"}</span>${it.watched ? `<span class="seen">Watched</span>` : ""}</div>
    <div class="name" title="${esc(it.name)}">${esc(it.name)}</div>
    <div class="sub">${[it.year, added && "Added " + added].filter(Boolean).join(" · ")}</div>
    <div class="acts">
      <button class="dl" data-act="dl" title="Request this on Telegram"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>Download</button>
      <button class="ib${it.watched ? " on" : ""}" data-act="seen" title="${it.watched ? "Mark as unwatched" : "Mark as watched"}" aria-pressed="${!!it.watched}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
      <button class="ib del" data-act="del" title="Remove"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div></article>`;
}

function render() {
  renderHero();
  const n = S.items.length, w = S.items.filter(i => i.watched).length;
  $("sW").textContent = w; $("sT").textContent = n;
  $("sBar").style.width = (n ? Math.round(w / n * 100) : 0) + "%";

  const list = view(), rows = $("rows");
  if (!list.length) {
    rows.innerHTML = n
      ? `<div class="empty"><h3>No matches</h3>Try a different filter or search.</div>`
      : `<div class="empty"><h3>Your list is empty</h3>Search above and tap a title to add it.</div>`;
    return;
  }
  const sec = (title, arr) => arr.length ? `<section class="sec"><h2>${title}<small>${arr.length}</small></h2><div class="grid">${arr.map(cardHTML).join("")}</div></section>` : "";
  const movies = list.filter(i => !isTv(i)), series = list.filter(isTv);
  rows.innerHTML = S.type === "all" ? sec("Movies", movies) + sec("Series", series)
                 : sec(S.type === "tv" ? "Series" : "Movies", list);
}

/* ---------- hero carousel (latest added titles) ---------- */
const hero = { items:[], keys:"", idx:0, timer:null, cache:{}, seq:0 };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function heroInfo(it) {
  const k = keyOf(it);
  if (hero.cache[k]) return hero.cache[k];
  let info = {};
  try {
    const d = await (await fetch(`https://api.themoviedb.org/3/${isTv(it) ? "tv" : "movie"}/${it.tmdbId}?api_key=${TMDB_KEY}&language=en-US`)).json();
    const mins = d.runtime || 0, seasons = d.number_of_seasons || 0;
    info = {
      bg: d.backdrop_path ? "https://image.tmdb.org/t/p/w1280" + d.backdrop_path : "",
      overview: d.overview || "",
      rating: d.vote_average ? d.vote_average.toFixed(1) : "",
      genres: (d.genres || []).slice(0, 3).map(g => g.name).join(", "),
      length: isTv(it) ? (seasons ? `${seasons} season${seasons > 1 ? "s" : ""}` : "") : (mins ? `${Math.floor(mins / 60)}h ${mins % 60}m` : "")
    };
  } catch (e) {}
  return (hero.cache[k] = info);
}

async function showSlide() {
  const it = hero.items[hero.idx]; if (!it) return;
  const seq = ++hero.seq;
  $("hTitle").textContent = it.name;
  $("hSeen").textContent = it.watched ? "Mark as unwatched" : "Mark as watched";
  document.querySelectorAll("#hDots button").forEach((b, i) => b.classList.toggle("on", i === hero.idx));
  const info = await heroInfo(it);
  if (seq !== hero.seq) return;
  $("hMeta").textContent = [isTv(it) ? "Series" : "Movie", info.length].filter(Boolean).join(", ");
  $("hRate").innerHTML = (info.rating ? `<b>★ ${esc(info.rating)}</b>` : "") + `<span>${esc([it.year, info.genres].filter(Boolean).join("  |  "))}</span>`;
  $("hDesc").textContent = info.overview;
  const src = info.bg || posterUrl(it.poster), img = $("hBg");
  if (img.getAttribute("src") !== src) {
    img.style.opacity = 0;
    const pre = new Image();
    pre.onload = pre.onerror = () => { if (seq === hero.seq) { img.src = src; img.style.opacity = 1; } };
    pre.src = src;
  }
}

function startHeroTimer() {
  clearInterval(hero.timer);
  if (reduceMotion || hero.items.length < 2) return;
  hero.timer = setInterval(() => { hero.idx = (hero.idx + 1) % hero.items.length; showSlide(); }, 6500);
}

function renderHero() {
  const items = S.items.filter(i => i.tmdbId)
    .sort((a, b) => ts(b) - ts(a) || b._i - a._i).slice(0, 6);
  const keys = items.map(keyOf).join("|");
  $("hero").hidden = !items.length;
  if (!items.length) { clearInterval(hero.timer); hero.items = []; hero.keys = ""; return; }
  hero.items = items;
  if (keys !== hero.keys) {                     // list changed: rebuild dots and restart
    hero.keys = keys; hero.idx = 0;
    $("hDots").innerHTML = items.map((it, i) => `<button aria-label="Show ${esc(it.name)}" data-i="${i}"></button>`).join("");
    startHeroTimer();
  }
  showSlide();
}
$("hDots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  hero.idx = +b.dataset.i; showSlide(); startHeroTimer();
});
$("hero").addEventListener("mouseenter", () => clearInterval(hero.timer));
$("hero").addEventListener("mouseleave", startHeroTimer);
$("hDl").addEventListener("click", () => hero.items[hero.idx] && requestDownload(hero.items[hero.idx]));
$("hSeen").addEventListener("click", () => {
  const it = hero.items[hero.idx]; if (!it) return;
  it.watched = !it.watched; save(); render();
  toast(it.watched ? "Marked as watched" : "Marked as unwatched");
});

/* ---------- card actions (event delegation) ---------- */
$("rows").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const k = btn.closest(".card").dataset.k;
  const it = S.items.find(i => keyOf(i) === k); if (!it) return;
  if (btn.dataset.act === "dl") return requestDownload(it);
  if (btn.dataset.act === "seen") {
    it.watched = !it.watched; save(); render();
    return toast(it.watched ? "Marked as watched" : "Marked as unwatched");
  }
  if (btn.dataset.act === "del") {
    const idx = S.items.indexOf(it);
    S.items.splice(idx, 1); save(); render();
    toast(`Removed "${it.name}"`, "Undo", () => { S.items.splice(idx, 0, it); S.items = dedupe(S.items); save(); render(); });
  }
});

/* ---------- filters ---------- */
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  S.type = b.dataset.type;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  render();
});
$("statusChips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  S.status = b.dataset.status;
  document.querySelectorAll("#statusChips .chip").forEach(c => c.classList.toggle("on", c === b));
  render();
});
$("sortSel").addEventListener("change", e => { S.sort = e.target.value; render(); });
$("findInput").addEventListener("input", e => { S.q = e.target.value.trim(); render(); });

/* ---------- search + add ---------- */
let acTimer, acSeq = 0, acResults = [];
const addInput = $("addInput"), ac = $("ac");
addInput.addEventListener("input", () => {
  clearTimeout(acTimer);
  const q = addInput.value.trim();
  if (!q) { ac.hidden = true; return; }
  acTimer = setTimeout(() => suggest(q), 300);
});
addInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !ac.hidden && acResults[0]) { e.preventDefault(); addTitle(acResults[0]); }
  if (e.key === "Escape") ac.hidden = true;
});
document.addEventListener("click", e => { if (!ac.contains(e.target) && e.target !== addInput) ac.hidden = true; });

async function suggest(q) {
  const seq = ++acSeq;
  try {
    const r = await (await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=en-US&page=1&include_adult=false&query=${encodeURIComponent(q)}`)).json();
    if (seq !== acSeq) return;
    acResults = (r.results || []).filter(i => (i.media_type === "movie" || i.media_type === "tv") && i.poster_path).slice(0, 7);
    ac.innerHTML = acResults.map((h, i) => {
      const year = (h.release_date || h.first_air_date || "").slice(0, 4);
      const inList = S.items.some(x => keyOf(x) === `${h.media_type}:${h.id}`);
      return `<button class="ac-row" data-i="${i}"><img src="https://image.tmdb.org/t/p/w92${h.poster_path}" alt="">
        <div><div class="ac-t">${esc(h.title || h.name)}</div><div class="ac-s">${h.media_type === "tv" ? "Series" : "Movie"}${year ? ", " + year : ""}</div></div>
        ${inList ? `<span class="ac-in">In your list</span>` : ""}</button>`;
    }).join("") || `<div class="ac-row" style="color:var(--dim)">No results found</div>`;
    ac.hidden = false;
  } catch (e) { console.error(e); }
}
ac.addEventListener("click", e => {
  const b = e.target.closest(".ac-row[data-i]"); if (b) addTitle(acResults[+b.dataset.i]);
});

function addTitle(h) {
  const name = h.title || h.name, key = `${h.media_type}:${h.id}`;
  ac.hidden = true; addInput.value = "";
  const exists = S.items.some(x => keyOf(x) === key || (!x.tmdbId && x.name.trim().toLowerCase() === name.trim().toLowerCase()));
  if (exists) return toast(`"${name}" is already in your list`);
  S.items.push({ name, watched:false, poster:IMG + h.poster_path, tmdbId:h.id, mediaType:h.media_type,
    year:(h.release_date || h.first_air_date || "").slice(0, 4), addedAt:new Date().toISOString(), _i:S.items.length });
  S.status = "all"; S.q = ""; $("findInput").value = "";
  document.querySelectorAll("#statusChips .chip").forEach(c => c.classList.toggle("on", c.dataset.status === "all"));
  save(); render();
  toast(`Added "${name}"`);
}

/* ---------- auth ---------- */
function showApp() {
  $("gate").hidden = true; $("app").hidden = false; $("tabs").hidden = false; $("user").hidden = false;
  $("uname").textContent = S.user; $("avatar").textContent = S.user.charAt(0);
}
function signOut(expired) {
  loadSeq++; clearInterval(hero.timer); hero.keys = ""; S.token = S.user = null; S.items = [];
  try { localStorage.removeItem("rt_auth"); } catch (e) {}
  $("app").hidden = true; $("tabs").hidden = true; $("user").hidden = true; $("gate").hidden = false;
  $("p").value = "";
  if (expired) $("loginErr").textContent = "Your session expired. Please sign in again.";
}
$("logout").addEventListener("click", () => signOut(false));

let loggingIn = false;
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (loggingIn) return;                       // a double press can no longer fire two logins/loads
  loggingIn = true; $("loginBtn").disabled = true; $("loginErr").textContent = "";
  try {
    const r = await fetch(`${API}/api/login`, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ username:$("u").value.trim(), password:$("p").value }) });
    const d = await r.json();
    if (!r.ok) { $("loginErr").textContent = d.error || "Sign in failed"; return; }
    S.token = d.token; S.user = d.username;
    try { localStorage.setItem("rt_auth", JSON.stringify({ token:d.token, user:d.username })); } catch (e) {}
    showApp(); await loadList();
  } catch (err) { console.error(err); $("loginErr").textContent = "Can't reach the server. It may be waking up, try again in a few seconds."; }
  finally { loggingIn = false; $("loginBtn").disabled = false; }
});

/* stay signed in */
(async () => {
  try {
    const a = JSON.parse(localStorage.getItem("rt_auth") || "null");
    if (a && a.token) { S.token = a.token; S.user = a.user; showApp(); await loadList(); }
  } catch (e) {}
})();
</script>
</body>
</html>
